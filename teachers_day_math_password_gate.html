<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher's Day — Math Challenge</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #f8e8ff, #e8f4ff);
    color: #25213a;
  }
  .card {
    width: min(92%, 620px);
    padding: 42px 34px;
    background: rgba(255,255,255,.94);
    border-radius: 28px;
    box-shadow: 0 18px 60px rgba(50,40,90,.16);
    text-align: center;
  }
  .emoji { font-size: 48px; }
  h1 { margin: 10px 0 8px; font-size: 30px; }
  .subtitle { color: #68627a; margin-bottom: 28px; }
  .problem {
    padding: 24px;
    border-radius: 18px;
    background: #f4f0ff;
    font-size: 25px;
    font-weight: 700;
    line-height: 1.5;
    margin: 20px 0;
  }
  input {
    width: min(100%, 300px);
    padding: 14px 16px;
    border: 2px solid #d8d1ea;
    border-radius: 14px;
    font-size: 18px;
    text-align: center;
    outline: none;
  }
  input:focus { border-color: #8b72d9; }
  button {
    margin-top: 14px;
    padding: 14px 24px;
    border: 0;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    background: #7357c7;
    color: white;
  }
  button:hover { transform: translateY(-1px); }
  #message { min-height: 26px; margin-top: 16px; font-weight: 700; }
  .success { color: #32805a; }
  .error { color: #c24c67; }
  .tiny { margin-top: 26px; font-size: 12px; color: #9993a8; }
</style>
</head>
<body>
  <main class="card">
    <div class="emoji">🧮🔐</div>
    <h1>Teacher's Day Math Challenge</h1>
    <p class="subtitle">Mrs. Sharmila, the card is locked. Only a math teacher may pass.</p>

    <div class="problem">
      Solve for the positive integer x:<br>
      <span>(x + 3)² − (x − 3)² = 444</span>
    </div>

    <p>Enter your answer to unlock the surprise:</p>
    <input id="answer" type="text" inputmode="numeric" autocomplete="off"
           placeholder="Your answer">
    <br>
    <button onclick="unlock()">UNLOCK THE CARD ✨</button>

    <div id="message"></div>
    <div class="tiny">No calculators. Probably. 😈</div>
  </main>

<script>
function unlock() {
  const answer = document.getElementById("answer").value.trim();
  const message = document.getElementById("message");

  // The challenge simplifies to 12x = 444, so the password is 37.
  if (answer === "37") {
    message.className = "success";
    message.textContent = "ACCESS GRANTED! 🎉";
    setTimeout(() => {
      window.location.href = "https://recocards.com/board/teachers-day-mrs-sharmila-158610061685";
    }, 700);
  } else {
    message.className = "error";
    message.textContent = "Nope! Back to the chalkboard. 😈";
  }
}

document.getElementById("answer").addEventListener("keydown", e => {
  if (e.key === "Enter") unlock();
});
</script>
</body>
</html>
